{% extends "base.html" %}
{% block title %}čakalneDobe{% endblock %}
{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" />

<div class="d-flex justify-content-between align-items-center my-5">
  <div>
      <a href="{% url 'home' %}" class="btn btn-primary">Nazaj</a>
  </div>

  <div class="d-flex justify-content-center align-items-center w-100">
      <h1 style="text-transform: uppercase; font-size: 40px; font-weight: bold; color: white; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);">
          čakalne dobe po tipih pregledov
      </h1>
  </div>
</div>

<div class="p-4 rounded shadow-lg bg-light">

    <div class="chart-container d-flex justify-content-center align-items-center">
        <canvas id="myLineChart" style="max-width: 900px; max-height: 400px; height: 230px;"></canvas>
    </div>

</div>



<style>
    .btn {
        background-color: #0466cf;
        color: white;
        padding-left: 20px;
        padding-right: 20px;
    }
    .btn:hover{
        background-color: white;
        color: #0466cf;
        border-width: 2px;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css">

<script>
  document.addEventListener("DOMContentLoaded", function () {
      fetch("/get_data_by_date/")
          .then(response => response.json())
          .then(data => {
              const labels = [...new Set(data.map(item => item.recorded_date))]; 
              const formattedLabels = labels.map((date, index) => {
                  const dateObj = new Date(date);
                  const monthName = dateObj.toLocaleString("default", { month: "long" });
                  return labels.findIndex(d => {
                      const dObj = new Date(d);
                      return dObj.toLocaleString("default", { month: "long" }) === monthName;
                  }) === index ? monthName : "";
              });

              console.log("Labels:", labels); 
              console.log("Formatted Labels:", formattedLabels); // Za debugging

              const kurativni = [];
              const diagnostični = [];
              const terapevtski = [];

              labels.forEach(date => {
                  const dateData = data.filter(item => item.recorded_date === date);

                  kurativni.push(
                      dateData.find(item => item.tip_vzs.includes("Kurativni"))?.st_cakajocih_vsota || 0
                  );
                  diagnostični.push(
                      dateData.find(item => item.tip_vzs.includes("Diagnostični"))?.st_cakajocih_vsota || 0
                  );
                  terapevtski.push(
                      dateData.find(item => item.tip_vzs.includes("Terapevtski"))?.st_cakajocih_vsota || 0
                  );
              });

              const ctx = document.getElementById("myLineChart").getContext("2d");
              new Chart(ctx, {
                  type: "line",
                  data: {
                      labels: labels, 
                      datasets: [
                          {
                              label: "Kurativni",
                              data: kurativni,
                              borderColor: "#FF5733",
                              backgroundColor: "rgba(255, 87, 51, 0.2)",
                              fill: true,
                              tension: 0.1,
                          },
                          {
                              label: "Diagnostični",
                              data: diagnostični,
                              borderColor: "#33B5FF",
                              backgroundColor: "rgba(51, 181, 255, 0.2)",
                              fill: true,
                              tension: 0.1,
                          },
                          {
                              label: "Terapevtski",
                              data: terapevtski,
                              borderColor: "#8E44AD",
                              backgroundColor: "rgba(142, 68, 173, 0.2)",
                              fill: true,
                              tension: 0.1,
                          },
                      ],
                  },
                  options: {
                      responsive: true,
                      plugins: {
                          legend: {
                              display: true,
                              position: "left",
                          },
                          title: {
                              display: true,
                              text: "Število čakajočih glede na tip pregleda",
                              font: {
                                  size: 24,
                              },
                              padding: {
                                  bottom: 50,
                              }
                          },
                          tooltip: {
                              callbacks: {
                                  label: function(tooltipItem) {
                                      const item = data[tooltipItem.dataIndex];  
                                      const date = new Date(item.recorded_date);  
                                      const nadDopCD = tooltipItem.raw; 
                                      const formattedDate = date.toLocaleDateString('sl-SI'); 

                                      return `${tooltipItem.dataset.label}: ${nadDopCD} čakajočih, Datum: ${formattedDate}`;
                                  }
                              }
                          }
                      },
                      scales: {
                          x: {
                              title: {
                                  display: true,
                                  text: "Mesec",
                              },
                              ticks: {
                                  callback: function (value, index) {
                                      const month = formattedLabels[index];
                                      // Prikaže ime meseca samo za prvi pojav v seznamu
                                      return formattedLabels.indexOf(month) === index ? month : "";
                                  },
                                  maxRotation: 80, // Rotiraj oznake za 90 stopinj
                                  minRotation: 60, // Minimalkan kot rotacije (enak za vse oznake)
                                  align: "center", // Sredinska poravnava
                              },
                          },
                          y: {
                              title: {
                                  display: true,
                                  text: "Število čakajočih",
                              },
                              beginAtZero: true,
                          },
                      },
                  }
              });
          })
          .catch(error => console.error("Napaka pri pridobivanju podatkov:", error));
  });
</script>



{% endblock %}
